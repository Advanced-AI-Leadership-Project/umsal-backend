                textColor: 10553fff
      Assets:
        # infra/aws/branding/logo-symbol.png (umsal-pwa apps/web/public/brand, 128px).
        - Category: FORM_LOGO
          ColorMode: LIGHT
          Extension: PNG
          Bytes: 
        # infra/aws/branding/favicon.ico: the logo at 48px as PNG-in-ICO (browser tab icon).
        - Category: FAVICON_ICO
          ColorMode: LIGHT
          Extension: ICO
          Bytes: 
Outputs:
  UserPoolId:
    Description: COGNITO_USER_POOL_ID for the API Lambda
    Value: !Ref UserPool
  WebClientId:
    Description: COGNITO_APP_CLIENT_IDS for the API Lambda and the PWA client id
    Value: !Ref WebClient
  Issuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  ManagedLoginDomain:
    Value: !Sub '${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
