AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  UMSAL Cognito user pool for the PWA (stack umsal-backend-auth, deployed 2026-11-05):
  managed login with authorization code + PKCE, a public app client without a secret,
  short-lived access tokens verified by the backend (api-contract D3), and the UMSAL Forest
  managed login branding (#57), with one opt-in native PKCE callback (#77).
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [../../docs/aws-stage2-design.md, ../../docs/api-contract.md, ../../docs/deployed-mobile-restoration.md]
    must:
      - Regional resources in the selected Region (ap-southeast-2) only
      - No client secret in a browser app; authorization code flow with PKCE only
      - Token storage location in the PWA is decided in umsal-pwa 24 and 25
Parameters:
  DomainPrefix:
    Type: String
    Default: umsal-family
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Managed login domain prefix (<prefix>.auth.ap-southeast-2.amazoncognito.com)
  CallbackUrl:
    Type: String
    Default: https://d86lxzcp0rvt4.cloudfront.net/auth/callback
    AllowedPattern: '^https://.+$'
  NativeCallbackUrl:
    Type: String
    Default: ''
    AllowedValues: ['', 'kr.ac.smu.umsal.inputprobe://oauth/callback']
    Description: Optional reviewed Android PKCE callback; empty keeps the web-only configuration
  LogoutUrl:
    Type: String
    Default: https://d86lxzcp0rvt4.cloudfront.net/
    AllowedPattern: '^https://.+$'
Conditions:
  HasNativeCallback: !Not [!Equals [!Ref NativeCallbackUrl, '']]
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Essentials tier is needed for managed login; 10,000 MAU per month are free.
        must: [Email is the only sign-in identifier, No phone numbers collected]
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
      # Open self sign-up and MFA OFF are draft defaults for a small synthetic-data trial.
      # Decide before real users: invitation-only (AllowAdminCreateUserOnly) and OPTIONAL MFA.
      MfaConfiguration: 'OFF'
      UserPoolTags: {Project: umsal-backend}
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Reuse the public PKCE client for the reviewed Android input app without removing the web callback.
        must:
          - Keep the HTTPS web callback, code flow, and no client secret
          - Native callback is opt-in and limited to the reviewed application scheme
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: umsal-pwa
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If
        - HasNativeCallback
        - [!Ref CallbackUrl, !Ref NativeCallbackUrl]
        - [!Ref CallbackUrl]
      LogoutURLs: [!Ref LogoutUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  Branding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: Domain  # managed login needs the domain to exist first
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      # UMSAL Forest (umsal-pwa docs/brand-identity.md): Cognito's merged defaults with the
      # light-mode colors mapped to the brand palette, light mode only, form logo on.
      # Test: tests/test_auth_branding.py.
      UseCognitoProvidedValues: false
      Settings:
        categories:
          auth:
            authMethodOrder:
            - - display: BUTTON
                type: FEDERATED
              - display: INPUT
                type: USERNAME_PASSWORD
            federation:
              interfaceStyle: BUTTON_LIST
              order: []
          form:
            displayGraphics: false
            instructions:
              enabled: false
            languageSelector:
              enabled: false
            location:
              horizontal: CENTER
              vertical: CENTER
            sessionTimerDisplay: NONE
          global:
            colorSchemeMode: LIGHT
            pageFooter:
              enabled: false
            pageHeader:
              enabled: false
            spacingDensity: REGULAR
          signUp:
            acceptanceElements:
            - enforcement: NONE
              textKey: en
        componentClasses:
          buttons:
            borderRadius: 12.0
          divider:
            darkMode:
              borderColor: 232b37ff
            lightMode:
              borderColor: e2e9e3ff
          dropDown:
            borderRadius: 10.0
            darkMode:
              defaults:
                itemBackgroundColor: 192534ff
              hover:
                itemBackgroundColor: 081120ff
                itemBorderColor: 5f6b7aff
                itemTextColor: e9ebedff
              match:
                itemBackgroundColor: d1d5dbff
                itemTextColor: 89bdeeff
            lightMode:
              defaults:
                itemBackgroundColor: ffffffff
              hover:
                itemBackgroundColor: f4f4f4ff
                itemBorderColor: 7d8998ff
                itemTextColor: 1b2e27ff
              match:
                itemBackgroundColor: e2efe5ff
                itemTextColor: 10553fff
          focusState:
            darkMode:
              borderColor: 539fe5ff
            lightMode:
              borderColor: 176b50ff
          idpButtons:
            icons:
              enabled: true
          input:
            borderRadius: 10.0
            darkMode:
              defaults:
                backgroundColor: 0f1b2aff
                borderColor: 5f6b7aff
              placeholderColor: 8d99a8ff
            lightMode:
              defaults:
                backgroundColor: ffffffff
                borderColor: 7d8998ff
              placeholderColor: 62736aff
          inputDescription:
            darkMode:
              textColor: 8d99a8ff
            lightMode:
              textColor: 62736aff
          inputLabel:
            darkMode:
              textColor: d1d5dbff
            lightMode:
              textColor: 1b2e27ff
          link:
            darkMode:
              defaults:
                textColor: 539fe5ff
              hover:
                textColor: 89bdeeff
            lightMode:
              defaults:
                textColor: 176b50ff
              hover:
                textColor: 10553fff
          optionControls:
            darkMode:
              defaults:
                backgroundColor: 0f1b2aff
                borderColor: 7d8998ff
              selected:
                backgroundColor: 539fe5ff
                foregroundColor: 000716ff
            lightMode:
              defaults:
                backgroundColor: ffffffff
                borderColor: 7d8998ff
              selected:
                backgroundColor: 176b50ff
                foregroundColor: ffffffff
          statusIndicator:
            darkMode:
              error:
                backgroundColor: 1a0000ff
                borderColor: eb6f6fff
                indicatorColor: eb6f6fff
              pending:
                indicatorColor: AAAAAAAA
              success:
                backgroundColor: 001a02ff
                borderColor: 29ad32ff
                indicatorColor: 29ad32ff
              warning:
                backgroundColor: 1d1906ff
                borderColor: e0ca57ff
                indicatorColor: e0ca57ff
            lightMode:
              error:
                backgroundColor: fff7f7ff
                borderColor: d91515ff
                indicatorColor: d91515ff
              pending:
                indicatorColor: AAAAAAAA
              success:
                backgroundColor: f2fcf3ff
                borderColor: 037f0cff
                indicatorColor: 037f0cff
              warning:
                backgroundColor: fffce9ff
                borderColor: 8d6605ff
                indicatorColor: 8d6605ff
        components:
          alert:
            borderRadius: 12.0
            darkMode:
              error:
                backgroundColor: 1a0000ff
                borderColor: eb6f6fff
            lightMode:
              error:
                backgroundColor: fff7f7ff
                borderColor: d91515ff
          favicon:
            enabledTypes:
            - ICO
          form:
            backgroundImage:
              enabled: false
            borderRadius: 16.0
            darkMode:
              backgroundColor: 0f1b2aff
              borderColor: 424650ff
            lightMode:
              backgroundColor: ffffffff
              borderColor: e2e9e3ff
            logo:
              enabled: true
              formInclusion: IN
              location: CENTER
              position: TOP
          idpButton:
            custom: {}
            standard:
              darkMode:
                active:
                  backgroundColor: 354150ff
                  borderColor: 89bdeeff
                  textColor: 89bdeeff
                defaults:
                  backgroundColor: 0f1b2aff
                  borderColor: c6c6cdff
                  textColor: c6c6cdff
                hover:
                  backgroundColor: 192534ff
                  borderColor: 89bdeeff
                  textColor: 89bdeeff
              lightMode:
                active:
                  backgroundColor: e2efe5ff
                  borderColor: 10553fff
                  textColor: 10553fff
                defaults:
                  backgroundColor: ffffffff
                  borderColor: 424650ff
                  textColor: 424650ff
                hover:
                  backgroundColor: f1f7f2ff
                  borderColor: 10553fff
                  textColor: 10553fff
          pageBackground:
            darkMode:
              color: 0f1b2aff
            image:
              enabled: false
            lightMode:
              color: f3f6f2ff
          pageFooter:
            backgroundImage:
              enabled: false
            darkMode:
              background:
                color: 0f141aff
              borderColor: 424650ff
            lightMode:
              background:
                color: fafafaff
              borderColor: d5dbdbff
            logo:
              enabled: false
              location: START
          pageHeader:
            backgroundImage:
              enabled: false
            darkMode:
              background:
                color: 0f141aff
              borderColor: 424650ff
            lightMode:
              background:
                color: fafafaff
              borderColor: d5dbdbff
            logo:
              enabled: false
              location: START
          pageText:
            darkMode:
              bodyColor: b6bec9ff
              descriptionColor: b6bec9ff
              headingColor: d1d5dbff
            lightMode:
              bodyColor: 1b2e27ff
              descriptionColor: 62736aff
              headingColor: 1b2e27ff
          phoneNumberSelector:
            displayType: TEXT
          primaryButton:
            darkMode:
              active:
                backgroundColor: 539fe5ff
                textColor: 000716ff
              defaults:
                backgroundColor: 539fe5ff
                textColor: 000716ff
              disabled:
                backgroundColor: ffffffff
                borderColor: ffffffff
              hover:
                backgroundColor: 89bdeeff
                textColor: 000716ff
            lightMode:
              active:
                backgroundColor: 10553fff
                textColor: ffffffff
              defaults:
                backgroundColor: 176b50ff
                textColor: ffffffff
              disabled:
                backgroundColor: e2efe5ff
                borderColor: c5dfcfff
              hover:
                backgroundColor: 10553fff
                textColor: ffffffff
          secondaryButton:
            darkMode:
              active:
                backgroundColor: 354150ff
                borderColor: 89bdeeff
                textColor: 89bdeeff
              defaults:
                backgroundColor: 0f1b2aff
                borderColor: 539fe5ff
                textColor: 539fe5ff
              hover:
                backgroundColor: 192534ff
                borderColor: 89bdeeff
                textColor: 89bdeeff
            lightMode:
              active:
                backgroundColor: e2efe5ff
