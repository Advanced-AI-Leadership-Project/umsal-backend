AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  UMSAL backend storage foundation (stack umsal-backend-storage, #52): one DynamoDB table for
  result bodies and the private audio bucket. Item keys and the upload/job APIs follow
  docs/mvp-recording-design.md (D8, #68); browser uploads need the CORS rule below (#70).
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [../../docs/aws-stage3-design.md, ../../SPEC.md, ../../docs/api-contract.md]
    must:
      - Regional resources in the selected Region (ap-southeast-2) only; no cross-Region replication
      - Synthetic data only until the retention and deletion policy (umsal-pwa 19) is settled
      - Grants and job state stay in PostgreSQL; this table never decides what may be shown
Parameters:
  UploadOrigins:
    Type: CommaDelimitedList
    Default: 'http://127.0.0.1:5173,http://127.0.0.1:4175'
    # Exact origins only: no wildcard, no path. Deploy with the PWA CloudFront origin.
    AllowedPattern: '^https?://[A-Za-z0-9.:-]+(,https?://[A-Za-z0-9.:-]+)*$'
    Description: >-
      Exact browser origins allowed to PUT audio with a presigned URL (#70): the PWA
      CloudFront address and local development. CORS is not access control; the
      presigned signature is.
Resources:
  ResultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          SPEC storage layout: utterances, observations, result views and weekly items.
          Generic pk/sk keys so the D8-dependent item design needs no table replacement.
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      DeletionProtectionEnabled: true
      Tags:
        - {Key: Project, Value: umsal-backend}
  AudioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Raw audio and job artifacts (SPEC). Versioning pins job inputs by version_id (D6);
          a deletion removes every version explicitly, and the lifecycle rule below is only
          the backstop for versions that a deletion run did not reach.
        must: [Private, encrypted, HTTPS only, no public access, never the umsal-demo-storage bucket]
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules:
          - {ObjectOwnership: BucketOwnerEnforced}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          # Browser upload with a presigned PUT (docs/mvp-recording-design.md 8). The
          # signed headers must be allowed; the version id must be readable for finalize.
          - Id: BrowserPresignedPut
            AllowedMethods: [PUT]
            AllowedOrigins: !Ref UploadOrigins
            AllowedHeaders: [content-type, x-amz-checksum-sha256, x-amz-sdk-checksum-algorithm]
            ExposedHeaders: [x-amz-version-id, ETag]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: ShortLivedOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags:
        - {Key: Project, Value: umsal-backend}
  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AudioBucket.Arn, !Sub '${AudioBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
Outputs:
  ResultsTableName:
    Description: DynamoDB table for result bodies (API parameter DynamoTableName)
    Value: !Ref ResultsTable
  ResultsTableArn:
    Value: !GetAtt ResultsTable.Arn
  AudioBucketName:
    Description: Private audio bucket (API parameter AudioBucketName, #70)
    Value: !Ref AudioBucket
