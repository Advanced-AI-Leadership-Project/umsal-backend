AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  UMSAL backend API (stack umsal-backend-api). HTTP API -> Lambda running the FastAPI app.
  Stage 1: no VPC, no database, no Cognito. Stage 2 (#42, deployed 2026-11-05): the optional
  parameters below put the Lambda in the private VPC with RDS PostgreSQL IAM auth and Cognito
  verification using a JWKS document fixed at deploy time. Stage 3 (#52): DynamoTableName adds
  the DynamoDB readiness check.
Metadata:
  # W1030 only: cfn-lint resolves the empty stage-1 default of LambdaSecurityGroupId
  # against the sg- pattern. The value is used only under UseVpc, where the Rules require
  # a real id and the parameter's AllowedPattern enforces the sg- format.
  cfn-lint:
    config:
      ignore_checks: [W1030]
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [../../docs/aws-deployment.md, ../../docs/aws-stage2-design.md, ../../SPEC.md]
    must:
      - Regional resources in the selected Region (ap-southeast-2) only
      - Do not modify umsal-pwa stacks or its CloudFront distribution from this stack
      - No secrets in parameters, environment variables or logs (JWKS are public keys)
      - Leaving every stage-2 parameter empty must keep the stage-1 deployment unchanged
Parameters:
  CpuPilotUsers:
    Type: String
    Default: ''
    AllowedPattern: '^$|^usr_[a-f0-9]{32},usr_[a-f0-9]{32}$'
    Description: Two internal synthetic test user IDs; empty disables new CPU jobs
  ArtifactBucket:
    Type: String
    Description: Bucket name output by the umsal-backend-bootstrap stack
  ArtifactKey:
    Type: String
    Description: S3 key of the API Lambda zip (lambda/<commit-sha>.zip)
    AllowedPattern: '^lambda/[0-9a-f]{40}\.zip$'
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev]
    Description: Value reported by /api/health/* as environment
  SubnetIds:
    Type: String
    Default: ''
    Description: >-
      Stage 2. PrivateSubnetIds output of umsal-backend-network, comma-separated
      (empty = no VPC). A String, not a list, so Rules can compare it with Equals.
  LambdaSecurityGroupId:
    Type: String
    Default: ''
    AllowedPattern: '^(sg-[0-9a-f]{8,17})?$'
    Description: Stage 2. LambdaSecurityGroupId output of umsal-backend-network
  DbHost:
    Type: String
    Default: ''
    Description: Stage 2. DbEndpoint output of umsal-backend-database (empty = no DB)
  DbResourceId:
    Type: String
    Default: ''
    Description: Stage 2. DbResourceId output of umsal-backend-database (db-...)
  DbUser:
    Type: String
    Default: umsal_app
    AllowedPattern: '^[a-z_][a-z0-9_]{0,62}$'
    Description: IAM-authenticated application user (no DDL privileges)
  CognitoUserPoolId:
    Type: String
    Default: ''
    Description: Stage 2. UserPoolId output of umsal-backend-auth (empty = no auth)
  CognitoAppClientIds:
    Type: String
    Default: ''
    Description: Stage 2. WebClientId output of umsal-backend-auth (comma-separated)
  CognitoJwks:
    Type: String
    Default: ''
    Description: >-
      Stage 2. The whole JWKS document of the user pool, fetched at deploy time by
      infra/aws/stage2_params.py. Public keys only. Redeploy after a key rotation.
  DynamoTableName:
    Type: String
    Default: ''
    AllowedPattern: '^([A-Za-z0-9_.-]{3,255})?$'
    Description: >-
      Stage 3 (#52). ResultsTableName output of umsal-backend-storage (empty = no table).
      Grants dynamodb:DescribeTable on this one table for the readiness check, and result
      item access only with AudioBucketName (RecordingStorage).
  AudioBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?$'
    Description: >-
      MVP recordings (#70). AudioBucketName output of umsal-backend-storage (empty = no
      upload API permissions).
Conditions:
  UseVpc: !Not [!Equals [!Ref SubnetIds, '']]
  UseDatabase: !Not [!Equals [!Ref DbHost, '']]
  UseCognito: !Not [!Equals [!Ref CognitoUserPoolId, '']]
  UseDynamo: !Not [!Equals [!Ref DynamoTableName, '']]
  UseAudio: !Not [!Equals [!Ref AudioBucketName, '']]
Rules:
  # Rules accept only rule functions (Equals, Not, And, Or, Contains, ...), not Join.
  VpcNeedsSecurityGroup:
    RuleCondition: !Not [!Equals [!Ref SubnetIds, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref LambdaSecurityGroupId, '']]
        AssertDescription: SubnetIds requires LambdaSecurityGroupId
  DatabaseNeedsVpc:
    RuleCondition: !Not [!Equals [!Ref DbHost, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref SubnetIds, '']]
        AssertDescription: The database is private; DbHost requires SubnetIds
      - Assert: !Not [!Equals [!Ref DbResourceId, '']]
        AssertDescription: DbHost requires DbResourceId for rds-db:connect
  CognitoNeedsJwks:
    RuleCondition: !Not [!Equals [!Ref CognitoUserPoolId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CognitoJwks, '']]
        AssertDescription: In the VPC the JWKS must be fixed at deploy time
      - Assert: !Not [!Equals [!Ref CognitoAppClientIds, '']]
        AssertDescription: CognitoUserPoolId requires CognitoAppClientIds
  AudioNeedsResultsTable:
    RuleCondition: !Not [!Equals [!Ref AudioBucketName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref DynamoTableName, '']]
        AssertDescription: Recording results live in the DynamoDB table; AudioBucketName requires DynamoTableName
Resources:
  FunctionLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7
  ApiLog:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  FunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Own logs always; VPC ENIs and rds-db:connect only when stage 2 is enabled.
        must: [rds-db:connect only for the single application user, never dbuser:*]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref AWS::AccountId}
      Policies:
        - PolicyName: OwnLogsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt FunctionLog.Arn
        - !If
          - UseVpc
          - PolicyName: VpcNetworkInterfaces
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DescribeSubnets
                    - ec2:DeleteNetworkInterface
                    - ec2:AssignPrivateIpAddresses
                    - ec2:UnassignPrivateIpAddresses
                  Resource: '*'  # ENI actions do not support resource-level scoping
          - !Ref AWS::NoValue
        - !If
          - UseDatabase
          - PolicyName: DatabaseAppUserOnly
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: rds-db:connect
                  Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
          - !Ref AWS::NoValue
        - !If
          - UseDynamo
          - PolicyName: DynamoReadinessOnly
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: dynamodb:DescribeTable
                  Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}'
          - !Ref AWS::NoValue
        - !If
          - UseAudio
          - PolicyName: RecordingStorage
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # docs/mvp-recording-design.md 8 (#70). PutObject only to sign browser
                # uploads; GetObject(Version) because HeadObject with ChecksumMode needs it
                # (code never reads a body); version deletes for finalize and deletion.
                - Sid: RecordingObjects
                  Effect: Allow
                  Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion, s3:DeleteObjectVersion]
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${AudioBucketName}/recordings/*'
                - Sid: ListRecordingVersions
                  Effect: Allow
                  Action: s3:ListBucketVersions
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${AudioBucketName}'
                  Condition:
                    StringLike: {'s3:prefix': 'recordings/*'}
                # Result bodies only (pk REC#...); PostgreSQL decides what may be shown.
                - Sid: RecordingResults
                  Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query]
                  Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}'
                  Condition:
                    ForAllValues:StringLike: {'dynamodb:LeadingKeys': ['REC#*']}
          - !Ref AWS::NoValue
  ApiFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Small bursty requests; no provisioned concurrency or NAT.
        must:
          - Mangum handler umsal_backend.lambda_handler.handler, Linux x86_64 wheels only
          - In the VPC there is no internet route; nothing may fetch from the internet
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: umsal_backend.lambda_handler.handler
      MemorySize: 256
      Timeout: 15
      ReservedConcurrentExecutions: 5
      Role: !GetAtt FunctionRole.Arn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      LoggingConfig:
        LogGroup: !Ref FunctionLog
      VpcConfig: !If
        - UseVpc
        - SubnetIds: !Split [',', !Ref SubnetIds]
          SecurityGroupIds: [!Ref LambdaSecurityGroupId]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          UMSAL_ENV: !Ref Environment
          UMSAL_CPU_PILOT_USERS: !Ref CpuPilotUsers
          DB_HOST: !If [UseDatabase, !Ref DbHost, !Ref AWS::NoValue]
          DB_USER: !If [UseDatabase, !Ref DbUser, !Ref AWS::NoValue]
          DB_NAME: !If [UseDatabase, umsal, !Ref AWS::NoValue]
          # Generous connect timeout, still well inside the 15s Lambda timeout.
          DB_CONNECT_TIMEOUT: !If [UseDatabase, '8', !Ref AWS::NoValue]
          COGNITO_USER_POOL_ID: !If [UseCognito, !Ref CognitoUserPoolId, !Ref AWS::NoValue]
          COGNITO_APP_CLIENT_IDS: !If [UseCognito, !Ref CognitoAppClientIds, !Ref AWS::NoValue]
          COGNITO_JWKS: !If [UseCognito, !Ref CognitoJwks, !Ref AWS::NoValue]
          DYNAMODB_TABLE: !If [UseDynamo, !Ref DynamoTableName, !Ref AWS::NoValue]
          AUDIO_BUCKET: !If [UseAudio, !Ref AudioBucketName, !Ref AWS::NoValue]
      Tags:
        - {Key: Project, Value: umsal-backend}
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-http'
      ProtocolType: HTTP
      Tags: {Project: umsal-backend}
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000  # above the 15s Lambda timeout, so the Lambda answers first
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Metadata:
      com.aws.cloudformation.Context:
        why: Throttling limits accidental cost; it is not an absolute spend cap.
        must: [Access log carries no headers, body, query string or source IP]
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5}
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLog.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Backend API Lambda errors; console state only, no notification subscription.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  ApiEndpoint:
    Description: Direct HTTP API URL (not yet behind the PWA CloudFront)
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionName:
    Value: !Ref ApiFunction
