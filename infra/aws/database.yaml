AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  UMSAL backend PostgreSQL (stack umsal-backend-database): RDS for PostgreSQL 17 inside the
  private VPC, IAM database authentication for the app and migrations, not publicly
  accessible. Aurora was not used because Free plan accounts may create Aurora only with
  express configuration (no VPC); see docs/aws-stage2-design.md (#44).
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [../../docs/aws-stage2-design.md, ../../SPEC.md]
    must:
      - Regional resources in the selected Region (ap-southeast-2) only
      - Never publicly accessible; reachable only from the backend Lambda security group
      - Synthetic data only until the retention and deletion policy (umsal-pwa 19) is settled
Parameters:
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: PrivateSubnetIds output of umsal-backend-network
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: DatabaseSecurityGroupId output of umsal-backend-network
  EngineVersion:
    Type: String
    Default: '17.11'
    Description: Matches the local Docker image (available in ap-southeast-2, 2026-11-05)
  InstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]
  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: UMSAL backend private subnets
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - {Key: Project, Value: umsal-backend}
  Parameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: UMSAL PostgreSQL 17 parameters
      Family: postgres17
      Parameters:
        rds.force_ssl: '1'  # explicit, not relying on the engine default
      Tags:
        - {Key: Project, Value: umsal-backend}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          IAM auth tokens are signed inside the Lambda, so no Secrets Manager endpoint is
          needed at runtime. The managed master password is only for the one-time user
          bootstrap (db-bootstrap.yaml) and break-glass use.
        must:
          - Always on (no auto-pause); stop manually when idle (RDS restarts it after 7 days)
          - App and migration users authenticate with IAM; the master user is not used by code
    Properties:
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref InstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBName: umsal
      MasterUsername: umsal_admin
      ManageMasterUserPassword: true
      EnableIAMDatabaseAuthentication: true
      DBParameterGroupName: !Ref Parameters
      DBSubnetGroupName: !Ref SubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroupId]
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      DeletionProtection: true
      CopyTagsToSnapshot: true
      Tags:
        - {Key: Project, Value: umsal-backend}
Outputs:
  DbEndpoint:
    Description: Private DNS endpoint for IAM-authenticated connections on 5432
    Value: !GetAtt Database.Endpoint.Address
  DbResourceId:
    Description: Used in the rds-db:connect IAM policy resource ARN (db-...)
    Value: !GetAtt Database.DbiResourceId
  MasterSecretArn:
    Description: Master credentials (Secrets Manager) for the one-time bootstrap only
    Value: !GetAtt Database.MasterUserSecret.SecretArn
