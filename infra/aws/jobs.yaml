AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  DRAFT (not deployed, #42). UMSAL backend jobs inside the private VPC (stack
  umsal-backend-jobs): the migration Lambda (operator-invoked, not behind API Gateway)
  and the daily maintenance purge (EventBridge Scheduler). Both use RDS PostgreSQL IAM auth.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [../../docs/aws-stage2-design.md]
    must:
      - Regional resources in the selected Region (ap-southeast-2) only
      - rds-db:connect only for one database user per function, never dbuser:*
      - The migration function has no resource policy; only IAM principals allowed to
        call lambda:InvokeFunction on it (the operator) can run it
Parameters:
  ArtifactBucket:
    Type: String
  ApiArtifactKey:
    Type: String
    Description: API zip (contains umsal_backend.maintenance)
    AllowedPattern: '^lambda/[0-9a-f]{40}\.zip$'
  MigrateArtifactKey:
    Type: String
    Description: Migration zip from build_lambda.py --kind migrate
    AllowedPattern: '^lambda/[0-9a-f]{40}-migrate\.zip$'
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DbHost:
    Type: String
    MinLength: 1
  DbResourceId:
    Type: String
    MinLength: 1
  AppDbUser:
    Type: String
    Default: umsal_app
    AllowedPattern: '^[a-z_][a-z0-9_]{0,62}$'
  MigrationDbUser:
    Type: String
    Default: umsal_migrator
    AllowedPattern: '^[a-z_][a-z0-9_]{0,62}$'
  AudioBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?$'
    Description: MVP recordings (#70). AudioBucketName output of umsal-backend-storage (empty = no sweep)
  DynamoTableName:
    Type: String
    Default: ''
    AllowedPattern: '^([A-Za-z0-9_.-]{3,255})?$'
    Description: MVP recordings (#70). ResultsTableName output of umsal-backend-storage
Conditions:
  UseRecordings: !Not [!Equals [!Ref AudioBucketName, '']]
Rules:
  RecordingsNeedResultsTable:
    RuleCondition: !Not [!Equals [!Ref AudioBucketName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref DynamoTableName, '']]
        AssertDescription: The recording sweep also deletes results; AudioBucketName requires DynamoTableName
Resources:
  MigrationLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-migrate'
      RetentionInDays: 7
  MaintenanceLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-maintenance'
      RetentionInDays: 7
  MigrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref AWS::AccountId}
      Policies:
        - PolicyName: MigrationMinimal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt MigrationLog.Arn
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'  # ENI actions do not support resource-level scoping
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${MigrationDbUser}'
  MaintenanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref AWS::AccountId}
      Policies:
        - PolicyName: MaintenanceMinimal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt MaintenanceLog.Arn
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${AppDbUser}'
        - !If
          - UseRecordings
          - PolicyName: RecordingSweep
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Expired uploads, deletion retries and the late-PUT re-sweep
                # (docs/mvp-recording-design.md 9). Delete and list only, no reads.
                - Sid: DeleteRecordingVersions
                  Effect: Allow
                  Action: s3:DeleteObjectVersion
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${AudioBucketName}/recordings/*'
                - Sid: ListRecordingVersions
                  Effect: Allow
                  Action: s3:ListBucketVersions
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${AudioBucketName}'
                  Condition:
                    StringLike: {'s3:prefix': 'recordings/*'}
                - Sid: DeleteRecordingResults
                  Effect: Allow
                  Action: [dynamodb:Query, dynamodb:DeleteItem]
                  Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}'
                  Condition:
                    ForAllValues:StringLike: {'dynamodb:LeadingKeys': ['REC#*']}
          - !Ref AWS::NoValue
  MigrationFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: The database is private and the operator machine cannot reach it.
        must: [Logs only revision identifiers, Not connected to API Gateway]
    Properties:
      FunctionName: !Sub '${AWS::StackName}-migrate'
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: umsal_backend.migration_lambda.handler
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt MigrationRole.Arn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref MigrateArtifactKey}
      LoggingConfig:
        LogGroup: !Ref MigrationLog
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_USER: !Ref MigrationDbUser
          DB_NAME: umsal
          DB_CONNECT_TIMEOUT: '20'
      Tags:
        - {Key: Project, Value: umsal-backend}
  MaintenanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-maintenance'
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: umsal_backend.maintenance.scheduled_handler
      MemorySize: 256
      Timeout: 60
      ReservedConcurrentExecutions: 1
      Role: !GetAtt MaintenanceRole.Arn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ApiArtifactKey}
      LoggingConfig:
        LogGroup: !Ref MaintenanceLog
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_USER: !Ref AppDbUser
          DB_NAME: umsal
          DB_CONNECT_TIMEOUT: '20'
          AUDIO_BUCKET: !If [UseRecordings, !Ref AudioBucketName, !Ref AWS::NoValue]
          DYNAMODB_TABLE: !If [UseRecordings, !Ref DynamoTableName, !Ref AWS::NoValue]
      Tags:
        - {Key: Project, Value: umsal-backend}
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              # Scheduler passes the schedule GROUP ARN as aws:SourceArn, not the schedule
              # ARN (docs: Scheduler confused deputy prevention). DailyPurge uses "default".
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default'
      Policies:
        - PolicyName: InvokeMaintenanceOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt MaintenanceFunction.Arn
  DailyPurge:
    Type: AWS::Scheduler::Schedule
    Metadata:
      com.aws.cloudformation.Context:
        why: Removes expired idempotency records (raw invite codes) and dead invitations (D11).
    Properties:
      Description: Daily purge of expired idempotency keys and unaccepted invitations
      ScheduleExpression: cron(0 18 * * ? *)  # 03:00 KST
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt MaintenanceFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumRetryAttempts: 2}
  RecordingSweep:
    Type: AWS::Scheduler::Schedule
    Condition: UseRecordings
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Stuck analysis jobs (lease), expired uploads, deletion retries and the late-PUT
          re-sweep must not wait for the daily purge (docs/mvp-recording-design.md 3, 9).
    Properties:
      Description: Recording sweep every 15 minutes (jobs, expired uploads, deletions)
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt MaintenanceFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"task": "recordings"}'
        RetryPolicy: {MaximumRetryAttempts: 0}
Outputs:
  MigrationFunctionName:
    Value: !Ref MigrationFunction
  MaintenanceFunctionName:
    Value: !Ref MaintenanceFunction
