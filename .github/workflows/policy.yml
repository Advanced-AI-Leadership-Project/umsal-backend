name: shared-git-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: shared-git-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the policy checker
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Check commit range and PR metadata
        run: python3 tools/check_git_policy.py --event-file "$GITHUB_EVENT_PATH"
