    LabelUpdate:
      type: object
      additionalProperties: false
      properties:
        label:
          $ref: '#/components/schemas/ConnectionLabel'
        demo: *id005
      required:
      - label
    InvitationTicket:
      type: object
      additionalProperties: false
      properties:
        invitation_id: *id002
        invite_code:
          type: string
        expires_at: *id006
      required:
      - invitation_id
      - invite_code
      - expires_at
    AcceptInvitation:
      type: object
      additionalProperties: false
      properties:
        invite_code:
          type: string
          minLength: 6
          maxLength: 64
        label:
          $ref: '#/components/schemas/ConnectionLabel'
        demo: *id005
      required:
      - invite_code
    RetryRequest:
      type: object
      additionalProperties: false
      properties:
        demo: *id005
      required: []
    RecordingPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recording'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
    TerminalDisposition:
      type: object
      additionalProperties: false
      properties:
        job_id: *id009
        terminal:
          const: true
        acknowledgement:
          const: DELETE_MESSAGE
        reason:
          type: string
          enum:
          - ALREADY_COMPLETED
          - CANCELLED
          - DELETED
          - EXPIRED
        durable_disposition_recorded:
          const: true
        demo: &id011
          type: boolean
      required:
      - job_id
      - terminal
      - acknowledgement
      - reason
      - durable_disposition_recorded
      - demo
      description: 이미 끝난/취소/삭제/만료 작업의 내구 처분 기록. 새 모델 결과 commit이 아니며 이 응답을 받은 같은 job 메시지만 폐기.
    DeletionAccepted:
      type: object
      additionalProperties: false
      properties:
        request_id: *id009
        deletion_id: *id009
        status:
          const: DELETING
        live_access_blocked:
          const: true
        status_url:
          type: string
          pattern: ^/deletions/[A-Za-z0-9_-]+$
      required:
      - request_id
      - deletion_id
      - status
      - live_access_blocked
      - status_url
    DeletionStatus:
      type: object
      additionalProperties: false
      properties:
        deletion_id: *id009
        scope:
          type: string
          enum:
          - RECORDING
          - CONNECTION_RECORDINGS
          - ALL_MY_RECORDINGS
        live_access_blocked:
          const: true
        live_deletion_status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
          - FAILED
        live_deleted_at:
          anyOf:
          - &id010
            type: string
            format: date-time
          - type: 'null'
        backup_status:
          type: string
          enum:
          - RETAINED_PENDING_EXPIRY
          - EXPIRED
          - NOT_APPLICABLE
        backup_expires_at:
          anyOf:
          - *id010
          - type: 'null'
        retryable: *id011
        last_error_code:
          anyOf:
          - type: string
            enum:
            - TEMPORARY_STORAGE_ERROR
            - DEPENDENT_JOB_RUNNING
            - BACKUP_POLICY_PENDING
          - type: 'null'
      required:
      - deletion_id
      - scope
      - live_access_blocked
      - live_deletion_status
      - live_deleted_at
      - backup_status
      - backup_expires_at
      - retryable
      - last_error_code
      description: 라이브 조회 차단·라이브 실제 삭제·백업 보관 만료는 별개. live COMPLETED만으로 모든 백업까지 완전 소거됐다고 표시하지 않는다.
      allOf:
      - if:
          properties:
            live_deletion_status:
              const: COMPLETED
        then:
          properties:
            live_deleted_at: *id010
        else:
          properties:
            live_deleted_at:
              type: 'null'
    DeviceRegistration:
      type: object
      additionalProperties: false
      properties:
        app_instance_id: *id009
        platform:
          const: ANDROID
        push_token:
          type: string
          minLength: 20
          maxLength: 8192
          writeOnly: true
        demo: *id011
      required:
      - app_instance_id
      - platform
      - push_token
      description: owner_id 입력 없음. 소유자는 검증한 Cognito subject로만 결정. 토큰은 응답/로그에서 제거.
    DeviceView:
      type: object
      additionalProperties: false
      properties:
        device_id: *id009
        platform:
          const: ANDROID
        enabled: *id011
        updated_at: *id010
      required:
      - device_id
      - platform
      - enabled
      - updated_at
      description: 기기 토큰·SNS endpoint/개인식별자는 응답하지 않는다.
