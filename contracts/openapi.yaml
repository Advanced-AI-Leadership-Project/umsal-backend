components:
  securitySchemes:
    CognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token(D3). 백엔드가 앱에서 직접 검증한다. RS256 서명(사용자 풀 JWKS, kid), iss, exp·iat, token_use=access(ID
        token 거부), 허용 client_id. 실패는 401 UNAUTHENTICATED, 인증 설정 없음·JWKS 장애는 503 TEMPORARILY_UNAVAILABLE. API Gateway
        JWT authorizer는 추가 방어선으로만 검토한다.
    AwsSigV4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS SigV4서명+API Gateway AWS_IAM route. IAM실행권한이있는worker role만허용. 단순header문자열검사로구현금지.
      x-amazon-apigateway-authtype: awsSigv4
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id: *id002
        retryable: &id005
          type: boolean
      required:
      - code
      - message
      - request_id
      - retryable
    Actor:
      type: object
      additionalProperties: false
      properties:
        user_id: *id002
        display_name:
          type: string
          maxLength: 80
      required:
      - user_id
      - display_name
    Accepted:
      type: object
      additionalProperties: false
      properties:
        request_id: *id002
        status:
          type: string
          enum:
          - ACCEPTED
          - PREPARING_INPUT
          - DELETING
          - CANCELLED
        resource_id: *id002
      required:
      - request_id
      - status
      - resource_id
    Connection:
      type: object
      additionalProperties: false
      properties:
        connection_id: *id002
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
          minItems: 2
          maxItems: 2
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DISCONNECTED
        version:
          type: integer
          minimum: 1
        label:
          description: 요청자가 이 연결의 상대를 부르는 호칭(D10). 요청자에게만 보이며 없으면 null.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 16
      required:
      - connection_id
      - participants
      - status
      - version
    ConnectionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
    LiveResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          const: ok
        service:
          const: api
        environment:
          type: string
