          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id001
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: actor+route 범위. 같은 key와 다른 요청 hash는409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
