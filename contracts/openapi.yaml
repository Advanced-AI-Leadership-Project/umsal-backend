            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 없음 또는 존재 비공개
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 버전·lease·idempotency 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 요청·schema·의미 검사 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 한도 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 일시 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
