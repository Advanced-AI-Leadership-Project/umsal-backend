openapi: 3.1.0
info:
  title: 엄살 MVP API 계약
  version: 0.4.0
  description: 설계 스키마. 원본은 umsal-backend contracts/(umsal-pwa e54088b의 v0.2.0에서 이관). 구현 상태는 umsal-backend
    SPEC "현재 구현 상태"를 따르며 이 문서의 operation이 실행 중임을 뜻하지 않는다. 모든 경로는 /api 아래(D2). 사용자CognitoBearer와기계AWS_IAM/SigV4
    분리. 모든긴처리는비동기.
servers:
- url: /api
  description: 같은 출처의 /api 접두사(D2). 직접 API Gateway 주소에서도 같은 경로를 쓴다.
tags:
- name: App
- name: Worker
- name: Ops
paths:
  /health/live:
    get:
      operationId: getHealthLive
      summary: 프로세스 생존 확인(D2)
      description: 인증 없음. 의존성 상태를 보증하지 않는다.
      security: []
      tags:
      - Ops
      responses:
        '200':
          description: 프로세스 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /health/ready:
    get:
      operationId: getHealthReady
      summary: 요청 처리 준비 확인(D2)
      description: 인증 없음. aurora·dynamodb를 각각 실제로 확인하고 모두 ok일 때만 ready. 확인하지 않은(not_configured) 의존성은
        준비되지 않은 것으로 본다. database는 PWA 호환 종합값.
      security: []
      tags:
      - Ops
      responses:
        '200':
          description: 모든 의존성 확인됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: 하나 이상의 의존성이 unavailable 또는 not_configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /me:
